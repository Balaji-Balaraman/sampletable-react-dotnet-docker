name: Snyk Full Repo Security Scan (.NET)

on:
  push:
    branches:
      - main
      - feature/develop
      - feature/integration
      - release/master
  pull_request:
    branches:
      - main
      - feature/develop
      - feature/integration
      - release/master

jobs:

  snyk-default:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore all projects
        run: |
          for file in $(find . -name '*.csproj'); do
            echo "Restoring $file"
            dotnet restore "$file"
          done

      - name: Build all projects
        run: |
          for file in $(find . -name '*.csproj'); do
            echo "Building $file"
            dotnet build "$file" --no-restore --configuration Release
          done

      - name: Install Snyk CLI & snyk-to-html
        run: |
          npm install -g snyk snyk-to-html

      - name: Run Snyk and generate reports
        run: |
          snyk test --all-projects --json > snyk-report.json || true
          snyk test --all-projects --json | snyk-to-html -o snyk-report.html || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload reports to Azure Blob Storage
        run: |
          timestamp=$(date +'%Y%m%d-%H%M%S')
          container_url="https://snyk.blob.core.windows.net/report"

          azcopy copy "snyk-report.json" "${container_url}/snyk-report-${timestamp}.json?sp=racwi&st=2025-06-03T12:55:47Z&se=2025-08-29T20:55:47Z&sv=2024-11-04&sr=c&sig=pBhuO60j7e0d7v9exxTNTZuuG3IMyzS%2BTw0%2F7geJQNY%3D" --overwrite=true
          azcopy copy "snyk-report.html" "${container_url}/snyk-report-${timestamp}.html?sp=racwi&st=2025-06-03T12:55:47Z&se=2025-08-29T20:55:47Z&sv=2024-11-04&sr=c&sig=pBhuO60j7e0d7v9exxTNTZuuG3IMyzS%2BTw0%2F7geJQNY%3D" --overwrite=true

      - name: Upload log message
        run: |
          echo "Snyk reports uploaded to Azure Blob Storage with timestamp: $timestamp"


  snyk-integration:
    if: github.ref == 'refs/heads/feature/integration'
    environment: integration-approval
    runs-on: ubuntu-latest

    steps:
      - name: Run reusable workflow for integration
        uses: ./.github/workflows/main.yml
        with:
          # You can move common logic to a reusable workflow to avoid duplication
          # But for now, this job runs the same steps as above
          # You can also copy-paste steps from snyk-default job

          # Or repeat the same logic here (same as snyk-default steps)
          run: echo "Same logic as above"

  snyk-release:
    if: github.ref == 'refs/heads/release/master'
    environment: release-approval
    runs-on: ubuntu-latest

    steps:
      - name: Run reusable workflow for release
        uses: ./.github/workflows/main.yml
        with:
          run: echo "Same logic as above"
